version: 2

before:
  hooks:
    - npm ci
    - npm run build
    - rm -rf internal/web/dist
    - mkdir -p internal/web/dist
    - cp -R client/dist/. internal/web/dist/

builds:
  - id: flatnotes
    main: ./cmd/flatnotes-go
    binary: flatnotes-go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    goos:
      - openbsd
      - freebsd
      - netbsd
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm

archives:
  - id: flatnotes
    ids:
      - flatnotes
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - id: standard
    images:
      - "ghcr.io/hadi77ir/flatnotes-go"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
  - id: rootless
    images:
      - "ghcr.io/hadi77ir/flatnotes-go"
    tags:
      - "{{ .Version }}-rootless"
      - "latest-rootless"
    dockerfile: Dockerfile.goreleaser.rootless
    platforms:
      - linux/amd64
      - linux/arm64
